    <title>Email Verified</title>

    <style>
      * {
        box-sizing: border-box;
        font-family:
          "Lato",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
      }

      body {
        margin: 0;
        background: #fffcfa;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }

      .screen {
        width: 100%;
        max-width: 420px;
        background: #fffcfa;
        padding: 32px 16px;
        border-radius: 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      h1 {
        font-family: "Fredoka", sans-serif;
        font-size: 32px;
        font-weight: 600;
        color: #ffc02e;
        margin: 24px 0 12px;
      }

      p {
        font-size: 16px;
        color: #261001;
        margin-bottom: 32px;
      }

      .check {
        font-size: 72px;
        line-height: 1;
      }

      .top-section {
        height: 50%;
        justify-content: space-around;
      }

      .spacer {
        height: 64px;
        flex: 1;
      }

      .logo-container {
        display: flex;
        flex: 1;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }

      .section-gap {
        height: 64px;
      }

      button {
        width: 100%;
        padding: 10px;
        border-radius: 16px;
        border: none;
        background: #ff842c;
        color: #fffcfa;
        font-size: 24px;
        font-family: "Fredoka", sans-serif;
        cursor: default;
      }
    </style>
